; PlatformIO build for the on7o capture firmware.
;
; The Arduino IDE can open m5sitcks3/on7o-capture/on7o-capture.ino directly;
; this file is for building from the command line instead.

[platformio]
src_dir = on7o-capture

[env:sticks3]
platform = espressif32
framework = arduino

; The StickS3 carries an ESP32-S3-PICO-1-N8R8: 8 MB flash, 8 MB octal PSRAM.
; M5Stack's own docs point at the generic S3 devkit definition.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    m5stack/M5Unified@^0.2.12

monitor_speed = 115200

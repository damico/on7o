; PlatformIO build for the on7o capture firmware.
;
; The Arduino IDE can open m5sitcks3/on7o-capture/on7o-capture.ino directly;
; this file is for building from the command line instead.

[platformio]
src_dir = on7o-capture

[env:sticks3]
platform = espressif32
framework = arduino

; The StickS3 carries an ESP32-S3-PICO-1-N8R8: 8 MB flash, 8 MB octal PSRAM.
; M5Stack's own docs point at the generic S3 devkit definition.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

; Arduino's auto-reset does not work on this board: the USB CDC is generated
; by the ESP32-S3 itself, so asserting DTR/RTS to request a reset makes the
; port disappear instead of resetting into the ROM bootloader. The board
; must be put into download mode by hand (see m5sitcks3/README.md) before
; flashing; --before=no_reset stops esptool from also trying its own reset.
upload_flags =
    --before=no_reset

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; NimBLE's MSYS_1 mbuf pool defaults to 12 blocks of 256 bytes, shared by
    ; the whole BLE host stack. Streaming AUDIO_CHUNK notifications back to
    ; back exhausts that in a couple of connection events (NimBLE then
    ; reports BLE_HS_ENOMEM on send after send), well before the app-level
    ; flow control in ble_transport.cpp ever gets a chance to matter.
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=64

lib_deps =
    m5stack/M5Unified@^0.2.12
    h2zero/NimBLE-Arduino@^2.5.1

monitor_speed = 115200
